name: Testing
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.0
          environments: default tests
          activate-environment: false
          locked: true

      - name: Run tests
        run: pixi run tests
